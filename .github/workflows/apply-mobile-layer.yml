name: Wire Mobile Responsive Layer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire mobile CSS and tighten mobile orbit
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          js = Path('js/main.js')
          html = index.read_text(encoding='utf-8')
          marker = 'css/mobile-final.css?v=1'
          if marker not in html:
              html = html.replace('</head>', '  <link rel="stylesheet" href="css/mobile-final.css?v=1">\n</head>', 1)
              index.write_text(html, encoding='utf-8')

          text = js.read_text(encoding='utf-8')
          replacements = {
              'const targetRxInner = 98;': 'const targetRxInner = 70;',
              'const targetRyInner = 52;': 'const targetRyInner = 42;',
              'const targetRxMiddle = 132;': 'const targetRxMiddle = 100;',
              'const targetRyMiddle = 72;': 'const targetRyMiddle = 58;',
              'const targetRxOuter = 162;': 'const targetRxOuter = 130;',
              'const targetRyOuter = 92;': 'const targetRyOuter = 76;',
              '(stageWidth / 2) - 40': '(stageWidth / 2) - 45',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          js.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/mobile-final.css js/main.js
          git diff --cached --quiet || git commit -m "Apply mobile-first responsive optimization"
          git push
