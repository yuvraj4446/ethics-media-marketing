name: Apply Mobile Final Optimization

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile optimization
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          index = root / 'index.html'
          css = root / 'css' / 'mobile-final.css'
          js = root / 'js' / 'main.js'

          mobile_css = r'''
/* ============================================================================
   EMM FINAL MOBILE OPTIMIZATION — 320/360/375/390/393/412/430px
   Desktop styles remain untouched.
   ============================================================================ */

@media (max-width: 767px) {
  html { scroll-padding-top: 72px; }
  body { overflow-x: clip; }
  .container { width: 100%; max-width: 100%; padding-inline: 18px !important; }
  .section { padding-block: 52px !important; }
  .header { padding-block: 10px !important; }
  .header__nav { min-height: 52px; padding-inline: 0 !important; }
  .brand-logo { height: 32px !important; max-width: 150px !important; }
  .mobile-toggle { width: 44px !important; height: 44px !important; padding: 9px !important; }
  .header__actions { gap: 0 !important; }

  /* HERO */
  .hero { padding-top: 82px !important; padding-bottom: 42px !important; }
  .hero__grid { display: grid !important; grid-template-columns: minmax(0, 1fr) !important; gap: 28px !important; align-items: start !important; }
  .hero__content, .hero__visual { min-width: 0 !important; width: 100% !important; max-width: 100% !important; }
  .hero__eyebrow { max-width: 100% !important; overflow: hidden; font-size: 10px !important; line-height: 1.35 !important; white-space: normal !important; }
  .hero__headline { font-size: clamp(42px, 11.8vw, 58px) !important; line-height: .96 !important; letter-spacing: -.045em !important; max-width: 100% !important; overflow-wrap: normal !important; }
  .hero__description { max-width: 345px !important; font-size: 14px !important; line-height: 1.55 !important; }
  .hero__ctas { display: grid !important; grid-template-columns: 1fr !important; gap: 10px !important; width: 100% !important; }
  .hero__ctas .btn { width: 100% !important; min-height: 48px !important; }
  .hero__meta { display: grid !important; grid-template-columns: repeat(2, minmax(0,1fr)) !important; gap: 18px 14px !important; margin-top: 24px !important; }
  .hero__meta .meta-item:last-child { grid-column: 1 / -1; }
  .meta-number { font-size: 17px !important; }
  .meta-label { font-size: 9px !important; line-height: 1.25 !important; }
  .hero__visual { min-height: 0 !important; }
  .hero-collage { width: min(100%, 340px) !important; margin-inline: auto !important; transform: none !important; }
  .hero-collage__card { max-width: 100% !important; }
  .marquee-strip { overflow: hidden !important; }

  /* SERVICES — preserve concept, make mobile compact */
  #services .services-ecosystem-header { gap: 14px !important; margin-bottom: 18px !important; }
  #services .services-ecosystem-title { font-size: clamp(34px, 9.5vw, 46px) !important; line-height: 1 !important; }
  #services .services-ecosystem-sub { font-size: 13px !important; line-height: 1.5 !important; max-width: 330px !important; }
  #services .services-ecosystem-stage-wrapper { padding: 18px 12px !important; margin-top: 12px !important; overflow: visible !important; }
  #services .services-ecosystem-stage { height: auto !important; max-width: 100% !important; display: flex !important; flex-direction: column !important; align-items: stretch !important; gap: 12px !important; }
  #services .services-ecosystem-svg { display: none !important; }
  #services .emm-ecosystem-core { position: relative !important; inset: auto !important; transform: none !important; width: 96px !important; height: 96px !important; margin: 0 auto 28px !important; flex: 0 0 auto !important; }
  #services .emm-eco-title { font-size: 1.25rem !important; }
  #services .emm-eco-subtitle { font-size: .58rem !important; }
  #services .emm-eco-label { bottom: -25px !important; font-size: .55rem !important; gap: .28rem !important; }
  #services .eco-service-card { position: relative !important; inset: auto !important; width: 100% !important; max-width: 100% !important; min-height: 0 !important; padding: 15px 15px 14px !important; transform: none !important; border-radius: 16px !important; }
  #services .eco-card__title { font-size: 17px !important; margin: 9px 0 4px !important; }
  #services .eco-card__desc { font-size: 12px !important; line-height: 1.4 !important; margin-bottom: 9px !important; }
  #services .eco-tag { font-size: 9px !important; padding: 3px 7px !important; }
  #services .services-metrics-ribbon { grid-template-columns: repeat(2, minmax(0,1fr)) !important; gap: 10px !important; padding: 14px !important; margin-top: 18px !important; }
  #services .metric-item { min-width: 0 !important; gap: 8px !important; }
  #services .metric-icon-box { width: 34px !important; height: 34px !important; }
  #services .metric-val { font-size: 16px !important; }
  #services .metric-lbl { font-size: 8px !important; line-height: 1.2 !important; }
  #services .scroll-explore-pill { grid-column: 1 / -1 !important; justify-content: center !important; }

  /* PROCESS */
  #process .section-header { margin-bottom: 24px !important; }
  #process .section-title { font-size: clamp(34px, 9vw, 46px) !important; line-height: 1 !important; }
  #process .section-subtitle { font-size: 13px !important; line-height: 1.5 !important; }
  #process .process-track-wrapper { overflow: visible !important; }
  #process .process-track-svg { display: none !important; }
  #process .process__grid--5 { display: grid !important; grid-template-columns: 1fr !important; gap: 14px !important; }
  #process .process-card { min-height: 0 !important; padding: 18px !important; border-radius: 16px !important; }
  #process .process-card__icon-node { width: 46px !important; height: 46px !important; }
  #process .process-card__title { font-size: 19px !important; margin-top: 12px !important; }
  #process .process-card__desc { font-size: 12px !important; line-height: 1.45 !important; }
  #process .process-card__tag { font-size: 9px !important; }

  /* TOOLS — dedicated compact mobile orbit */
  #skills { padding-block: 54px !important; overflow: clip !important; }
  #skills .tools-ecosystem-header { display: flex !important; flex-direction: column !important; gap: 16px !important; margin-bottom: 12px !important; }
  #skills .tools-ecosystem-title { font-size: clamp(34px, 10vw, 48px) !important; line-height: .98 !important; }
  #skills .tools-ecosystem-sub { font-size: 13px !important; }
  #skills .tools-ecosystem-header__right { align-items: flex-start !important; gap: 10px !important; }
  #skills .tools-vision-group { display: none !important; }
  #skills .tools-orbit-stage-wrapper { width: 100% !important; margin: 8px auto 0 !important; padding: 0 !important; overflow: visible !important; }
  #skills .tools-orbit-stage { width: 100% !important; height: 390px !important; min-height: 390px !important; overflow: visible !important; }
  #skills .tools-orbit-svg { width: 100% !important; height: 100% !important; }
  #skills .emm-orbit-core { width: 96px !important; height: 96px !important; }
  #skills .emm-core-title { font-size: 1.25rem !important; }
  #skills .emm-core-subtitle { font-size: .5rem !important; }
  #skills .tool-orbit-node { width: 82px !important; min-height: 72px !important; z-index: 30 !important; }
  #skills .tool-logo, #skills .tool-node-circle { width: 44px !important; height: 44px !important; min-width: 44px !important; min-height: 44px !important; }
  #skills .tool-logo img, #skills .tool-logo-img, #skills .tool-icon-img { width: 26px !important; height: 26px !important; }
  #skills .tool-name, #skills .tool-node-label { font-size: 8px !important; margin-top: 4px !important; max-width: 82px !important; overflow: hidden !important; text-overflow: ellipsis !important; }
  #skills .tools-orbit-tooltip { margin-top: 8px !important; padding: 9px 12px !important; font-size: 10px !important; }
  #skills .tools-ecosystem-ribbon { grid-template-columns: repeat(2, minmax(0,1fr)) !important; gap: 8px !important; padding: 12px !important; margin-top: 18px !important; border-radius: 16px !important; }
  #skills .tools-ribbon-item { gap: 7px !important; min-width: 0 !important; }
  #skills .tools-ribbon-icon { width: 32px !important; height: 32px !important; }
  #skills .tools-ribbon-text strong { font-size: 14px !important; }
  #skills .tools-ribbon-text span { font-size: 8px !important; }

  /* WORK */
  #work { padding-block: 54px !important; overflow: clip !important; }
  #work .work-reels-header { gap: 14px !important; margin-bottom: 12px !important; }
  #work .work-reels-title { font-size: clamp(38px, 10vw, 52px) !important; }
  #work .work-reels-subtitle { font-size: 13px !important; }
  #work .work-reels-header__right { justify-content: space-between !important; width: 100% !important; }
  #work .work-accent-script { font-size: 18px !important; }
  #work .reel-nav-btn { width: 42px !important; height: 42px !important; }
  #work .work-reels-filter-row { width: calc(100vw - 36px) !important; max-width: calc(100vw - 36px) !important; overflow-x: auto !important; overscroll-behavior-x: contain; }
  #work .work__filter-bar { width: max-content !important; max-width: none !important; }
  #work .filter-btn { min-height: 42px !important; padding: 9px 14px !important; font-size: 11px !important; }
  #work .work-reels-stage { padding-block: 8px 18px !important; overflow: hidden !important; }
  #work .work-reels-viewport { width: 100% !important; overflow: hidden !important; mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent) !important; }
  #work .work-reels-track { gap: 12px !important; }
  #work .work-reel-card { width: 78vw !important; max-width: 306px !important; min-width: 250px !important; border-radius: 18px !important; }
  #work .work-reel-card__headline { font-size: 22px !important; line-height: 1 !important; }
  #work .work-reel-card__badge { font-size: 8px !important; padding: 5px 8px !important; }
  #work .work-reel-card__bottom-bar { padding: 10px 11px !important; }
  #work .work-reel-card__subtitle { font-size: 9px !important; }

  /* FEATURED / CONTACT / FOOTER */
  #featured .container, #contact .container { padding-inline: 18px !important; }
  #featured .section-title, #contact .section-title { font-size: clamp(34px, 9vw, 48px) !important; }
  #featured .btn, #contact .btn { min-height: 48px !important; }
  #featured img, #featured video { max-width: 100% !important; height: auto !important; }
  #contact input, #contact textarea, #contact select { width: 100% !important; min-height: 48px !important; font-size: 16px !important; }
  #contact form { width: 100% !important; }
  footer .container { padding-inline: 18px !important; }

  /* Remove accidental fixed/min widths from common components */
  .hero *, #services *, #process *, #skills *, #work *, #featured *, #contact *, footer * { max-width: 100%; }
}

@media (max-width: 430px) {
  #skills .tools-orbit-stage { height: 370px !important; min-height: 370px !important; }
  #skills .tool-orbit-node { width: 78px !important; min-height: 68px !important; }
  #skills .tool-logo, #skills .tool-node-circle { width: 42px !important; height: 42px !important; min-width: 42px !important; min-height: 42px !important; }
  #skills .tool-logo img, #skills .tool-logo-img, #skills .tool-icon-img { width: 25px !important; height: 25px !important; }
  #skills .tool-name, #skills .tool-node-label { font-size: 7.5px !important; max-width: 78px !important; }
  #work .work-reel-card { width: 80vw !important; min-width: 0 !important; }
}

@media (max-width: 360px) {
  .container { padding-inline: 15px !important; }
  .hero { padding-top: 76px !important; }
  .hero__headline { font-size: 39px !important; }
  #skills .tools-orbit-stage { height: 350px !important; min-height: 350px !important; }
  #skills .tool-orbit-node { width: 70px !important; min-height: 64px !important; }
  #skills .tool-logo, #skills .tool-node-circle { width: 38px !important; height: 38px !important; min-width: 38px !important; min-height: 38px !important; }
  #skills .tool-logo img, #skills .tool-logo-img, #skills .tool-icon-img { width: 22px !important; height: 22px !important; }
  #skills .tool-name, #skills .tool-node-label { font-size: 7px !important; max-width: 70px !important; }
}
'''

          css.parent.mkdir(parents=True, exist_ok=True)
          css.write_text(mobile_css.strip() + '\n', encoding='utf-8')

          html = index.read_text(encoding='utf-8')
          marker = 'css/mobile-final.css?v=1'
          if marker not in html:
              html = html.replace('</head>', '  <link rel="stylesheet" href="css/mobile-final.css?v=1">\n</head>', 1)
              index.write_text(html, encoding='utf-8')

          text = js.read_text(encoding='utf-8')
          # Tighten only the existing mobile orbit radii so all 21 nodes fit inside a phone.
          replacements = {
              'const targetRxInner = 98;': 'const targetRxInner = 70;',
              'const targetRyInner = 52;': 'const targetRyInner = 42;',
              'const targetRxMiddle = 132;': 'const targetRxMiddle = 100;',
              'const targetRyMiddle = 72;': 'const targetRyMiddle = 58;',
              'const targetRxOuter = 162;': 'const targetRxOuter = 130;',
              'const targetRyOuter = 92;': 'const targetRyOuter = 76;',
              "(stageWidth / 2) - 40": "(stageWidth / 2) - 45",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          js.write_text(text, encoding='utf-8')

      - name: Commit mobile optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/mobile-final.css js/main.js
          git diff --cached --quiet || git commit -m "Optimize website for mobile screens"
          git push

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm -f .github/workflows/mobile-final-fix.yml || true
          git commit -m "Remove temporary mobile fix workflow" || true
          git push || true
